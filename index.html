<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Пошук техніки</title>
<link rel="preload" href="fonts/geologica-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css?v=202610141030">
<link rel="stylesheet" href="style.css?v=202610141030">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1317'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffb23e' stroke-width='2.5'/%3E%3Cpath d='M16 3v8M16 21v8M3 16h8M21 16h8' stroke='%23ffb23e' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body>

<!-- фон стартових екранів -->
<div class="bgvid" id="bgvid" aria-hidden="true" hidden>
  <video muted loop playsinline preload="metadata" poster="media/bg.jpg"><source src="media/bg.mp4" type="video/mp4"><source src="media/bg.webm" type="video/webm"></video>
</div>

<!-- вхід -->
<section id="s-login" class="screen center" hidden>
  <form class="card narrow" id="login-form">
    <h1 class="logo"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M20 2v9M20 29v9M2 20h9M29 20h9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="20" r="2.5" fill="currentColor"/></svg><span>Пошук техніки</span></h1>
    <p class="muted" id="login-sub">Тренування з пошуку техніки на знімках</p>
    <label for="login-pass">Пароль підрозділу</label>
    <input id="login-pass" type="password" autocomplete="current-password" required>
    <p class="err" id="login-err" role="alert"></p>
    <button class="primary" type="submit" id="login-btn">Увійти</button>
    <a class="link" href="#admin">⚙ Адмінка</a>
  </form>
</section>

<!-- старт -->
<section id="s-start" class="screen center" hidden>
  <form class="card narrow" id="start-form">
    <h1 class="logo"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M20 2v9M20 29v9M2 20h9M29 20h9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="20" r="2.5" fill="currentColor"/></svg><span>Пошук техніки</span></h1>
    <label for="callsign">Позивний</label>
    <input id="callsign" autocomplete="nickname" maxlength="40" required>
    <div class="pick"><div class="pick-h">Режим</div><div class="modes" id="pick-mode" role="radiogroup" aria-label="Режим"></div></div>
    <div class="pick"><div class="pick-h">Напрямок</div><div class="chips" id="pick-region" role="radiogroup" aria-label="Напрямок"></div></div>
    <div class="pick"><div class="pick-h">Пора року</div><div class="chips" id="pick-season" role="radiogroup" aria-label="Пора року"></div></div>
    <p class="muted" id="start-info"></p>
    <p class="err" id="start-err" role="alert"></p>
    <button class="primary" type="submit" id="start-btn">Почати</button>
    <p class="muted small" id="pending-info"></p>
    <div class="links"><button type="button" class="link" id="logout-btn">Вийти</button><a class="link" href="#admin">⚙ Адмінка</a></div>
  </form>
</section>

<!-- гра -->
<section id="s-game" class="screen game" hidden>
  <header class="bar top">
    <div class="stage" id="g-stage"></div>
    <div class="stats">
      <div title="Залишилось часу"><span class="lbl">Залишилось</span><i>⏱</i><b id="g-time">1:00</b></div>
      <div title="Знайдено цілей"><span class="lbl">Цілі</span><i>🎯</i><b id="g-found">0/1</b></div>
      <div title="Промахи"><span class="lbl">Промахи</span><i>✗</i><b id="g-miss">0/1</b></div>
      <div title="Бали"><span class="lbl">Бали</span><i>★</i><b id="g-score">0</b></div>
    </div>
  </header>
  <div class="timebar"><i id="g-timebar"></i></div>
  <div class="view-wrap">
    <div id="g-view" class="view-host"></div>
    <div class="hud" id="g-hud" aria-hidden="true">
      <div class="hud-tl" id="hud-tl"></div>
      <div class="hud-tc"><span class="rec">●</span> REC <span id="hud-clock">00:00</span></div>
      <div class="hud-bl" id="hud-bl"></div>
      <div class="hud-br" id="hud-br"></div>
    </div>
    <div class="loading" id="g-loading" hidden><span>Завантажую знімок…</span></div>
    <aside class="debrief" id="g-debrief" hidden></aside>
    <div class="msg" id="g-msg" role="status"></div>
    <button type="button" class="iconbtn" id="g-sound" title="Звук увімк./вимк." aria-label="Звук">🔊</button>
    <div class="brief" id="g-brief" hidden></div>
  </div>
  <footer class="bar bottom">
    <button type="button" id="g-hint" title="Показати район 2×2 квадрати, де ціль (бали за етап: 5 замість 10)">💡<span class="lbl"> Підказка</span></button>
    <button type="button" id="g-skip">Пропустити</button>
    <button type="button" class="primary" id="g-next" hidden>Далі →</button>
    <button type="button" id="g-quit">Вийти</button>
    <div class="foot-tools" id="g-tools"></div>
  </footer>
</section>

<!-- підсумок -->
<section id="s-summary" class="screen center" hidden>
  <div class="card wide">
    <h1 id="sum-title">Підсумок</h1>
    <div class="rank" id="sum-rank"></div>
    <p class="big" id="sum-total"></p>
    <div class="table-wrap"><table id="sum-table"></table></div>
    <p class="muted" id="sum-sync" role="status"></p>
    <button class="primary" type="button" id="sum-again">Нова гра</button>
  </div>
</section>

<!-- адмінка -->
<section id="s-admin" class="screen admin" hidden></section>

<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js?v=202610141030"></script>
<script src="js/sfx.js?v=202610141030"></script>
<script src="js/fx.js?v=202610141030"></script>
<script src="js/api.js?v=202610141030"></script>
<script src="js/tiles.js?v=202610141030"></script>
<script src="js/viewer.js?v=202610141030"></script>
<script src="js/logic.js?v=202610141030"></script>
<script src="js/game.js?v=202610141030"></script>
<script src="js/compose.js?v=202610141030"></script>
<script src="js/scale.js?v=202610141030"></script>
<script src="js/models.js?v=202610141030"></script>
<script src="js/generator.js?v=202610141030"></script>
<script src="js/autogen.js?v=202610141030"></script>
<script src="js/admin.js?v=202610141030"></script>
<script src="js/main.js?v=202610141030"></script>
</body>
</html>
