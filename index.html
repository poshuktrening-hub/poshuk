<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Пошук техніки</title>
<link rel="preload" href="fonts/geologica-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css?v=202610151445">
<link rel="stylesheet" href="style.css?v=202610151445">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1317'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffb23e' stroke-width='2.5'/%3E%3Cpath d='M16 3v8M16 21v8M3 16h8M21 16h8' stroke='%23ffb23e' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body>

<!-- фон стартових екранів -->
<div class="bgvid" id="bgvid" aria-hidden="true" hidden>
  <video muted loop playsinline preload="metadata" poster="media/bg.jpg"><source src="media/bg.mp4" type="video/mp4"><source src="media/bg.webm" type="video/webm"></video>
</div>

<!-- вхід -->
<section id="s-login" class="screen center" hidden>
  <form class="card narrow" id="login-form">
    <h1 class="logo"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M20 2v9M20 29v9M2 20h9M29 20h9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="20" r="2.5" fill="currentColor"/></svg><span>Пошук техніки</span></h1>
    <p class="muted" id="login-sub">Тренування з пошуку техніки на знімках</p>
    <label for="login-pass">Пароль підрозділу</label>
    <input id="login-pass" type="password" autocomplete="current-password" required>
    <p class="err" id="login-err" role="alert"></p>
    <button class="primary" type="submit" id="login-btn">Увійти</button>
    <a class="link" href="#admin">⚙ Адмінка</a>
  </form>
</section>

<!-- старт -->
<section id="s-start" class="screen center" hidden>
  <form class="card narrow" id="start-form">
    <h1 class="logo"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M20 2v9M20 29v9M2 20h9M29 20h9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="20" r="2.5" fill="currentColor"/></svg><span>Пошук техніки</span></h1>
    <label for="callsign">Позивний</label>
    <input id="callsign" autocomplete="nickname" maxlength="40" required>
    <div class="main-menu" id="main-menu">
      <button type="button" class="mm" data-go="search"><b>Пошук цілей</b><ol class="top3" id="top-search"></ol></button>
      <button type="button" class="mm" data-go="cards"><b>Картки цілей</b><ol class="top3" id="top-cards"></ol></button>
      <button type="button" class="mm mm-ref" data-go="ref"><b>Довідник техніки</b><span>Фото, ТТХ і характерні ознаки</span></button>
    </div>
    <div class="sub" id="sub-search" hidden>
      <div class="sub-h"><button type="button" class="link back" data-go="menu">← Меню</button><h2>Пошук цілей</h2></div>
      <div class="pick"><div class="pick-h">Режим</div><div class="modes" id="pick-mode" role="radiogroup" aria-label="Режим"></div></div>
      <div class="pick"><div class="pick-h">Напрямок</div><div class="chips" id="pick-region" role="radiogroup" aria-label="Напрямок"></div></div>
      <div class="pick"><div class="pick-h">Пора року</div><div class="chips" id="pick-season" role="radiogroup" aria-label="Пора року"></div></div>
      <p class="muted" id="start-info"></p>
      <button class="primary" type="submit" id="start-btn">Почати</button>
      <button type="button" class="link help-link" data-help="search">Як грати?</button>
    </div>
    <div class="sub" id="sub-cards" hidden>
      <div class="sub-h"><button type="button" class="link back" data-go="menu">← Меню</button><h2>Картки цілей</h2></div>
      <div class="pick"><div class="pick-h">Режим</div><div class="modes" id="pick-cmode" role="radiogroup" aria-label="Режим"></div></div>
      <p class="muted" id="c-info"></p>
      <button class="primary" type="button" id="c-start">Почати</button>
      <button type="button" class="link help-link" data-help="cards">Як грати?</button>
    </div>
    <p class="err" id="start-err" role="alert"></p>
    <p class="muted small" id="pending-info"></p>
    <div class="links"><button type="button" class="link" id="logout-btn">Вийти</button><a class="link" href="#admin">⚙ Адмінка</a></div>
  </form>
</section>

<!-- картки цілей -->
<section id="s-cards" class="screen cards" hidden>
  <header class="bar top">
    <div class="stage" id="c-stage"></div>
    <div class="stats">
      <div title="Залишилось часу"><span class="lbl">Час</span><i>⏱</i><b id="c-time">0:30</b></div>
      <div title="Бали"><span class="lbl">Бали</span><i>★</i><b id="c-score">0</b></div>
    </div>
  </header>
  <div class="timebar"><i id="c-timebar"></i></div>
  <div class="c-pic" id="c-pic"><img id="c-img" alt="Техніка на фото"><div class="loading" id="c-loading" hidden><span>Завантажую фото…</span></div></div>
  <div class="c-bottom">
    <div class="c-reveal" id="c-reveal" hidden></div>
    <form class="c-form" id="c-form" autocomplete="off">
      <p class="c-hint" id="c-hint" hidden></p>
      <div class="c-choices" id="c-choices"></div>
      <div class="c-row c-type">
        <input id="c-answer" type="text" inputmode="text" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Назва техніки, напр. Т-72Б3" aria-label="Назва техніки">
        <button type="submit" class="primary" id="c-check">Перевірити</button>
      </div>
      <div class="c-row c-row2">
        <button type="button" id="c-hint-btn">💡 Підказка</button>
        <button type="button" class="link" id="c-quit">Вийти</button>
      </div>
    </form>
    <div class="c-next" id="c-nextbox" hidden><button type="button" class="primary" id="c-next">Далі</button><i class="cd-bar" id="c-cd"></i></div>
  </div>
</section>

<!-- довідник техніки -->
<section id="s-ref" class="screen ref" hidden>
  <header class="bar top"><button type="button" class="link" id="r-back">← Меню</button><div class="stage">Довідник техніки</div><span class="muted small" id="r-count"></span><button type="button" class="iconbtn" id="r-help" title="Як користуватись" aria-label="Як користуватись">?</button></header>
  <div class="r-tools"><input id="r-q" type="search" placeholder="Пошук: Т-72, Бук, РЕБ, катки…" autocomplete="off" aria-label="Пошук у довіднику"><div class="chips r-cats" id="r-cats"></div></div>
  <div class="r-list" id="r-list"></div>
  <div class="r-detail" id="r-detail" hidden></div>
  <div class="r-zoom" id="r-zoom" hidden></div>
</section>

<!-- гра -->
<section id="s-game" class="screen game" hidden>
  <header class="bar top">
    <div class="stage" id="g-stage"></div>
    <div class="stats">
      <div title="Залишилось часу"><span class="lbl">Залишилось</span><i>⏱</i><b id="g-time">1:00</b></div>
      <div title="Знайдено цілей"><span class="lbl">Цілі</span><i>🎯</i><b id="g-found">0/1</b></div>
      <div title="Промахи"><span class="lbl">Промахи</span><i>✗</i><b id="g-miss">0/1</b></div>
      <div title="Бали"><span class="lbl">Бали</span><i>★</i><b id="g-score">0</b></div>
    </div>
  </header>
  <div class="timebar"><i id="g-timebar"></i></div>
  <div class="view-wrap">
    <div id="g-view" class="view-host"></div>
    <div class="hud" id="g-hud" aria-hidden="true">
      <div class="hud-tl" id="hud-tl"></div>
      <div class="hud-tc"><span class="rec">●</span> REC <span id="hud-clock">00:00</span></div>
      <div class="hud-bl" id="hud-bl"></div>
      <div class="hud-br" id="hud-br"></div>
    </div>
    <div class="loading" id="g-loading" hidden><span>Завантажую знімок…</span></div>
    <aside class="debrief" id="g-debrief" hidden></aside>
    <div class="msg" id="g-msg" role="status"></div>
    <button type="button" class="iconbtn" id="g-sound" title="Звук увімк./вимк." aria-label="Звук">🔊</button>
    <div class="brief" id="g-brief" hidden></div>
  </div>
  <footer class="bar bottom">
    <button type="button" id="g-hint" title="Показати район 2×2 квадрати, де ціль (бали за етап: 5 замість 10)">💡<span class="lbl"> Підказка</span></button>
    <button type="button" id="g-skip">Пропустити</button>
    <button type="button" class="primary" id="g-next" hidden>Далі →</button>
    <button type="button" id="g-quit">Вийти</button>
    <div class="foot-tools" id="g-tools"></div>
  </footer>
</section>

<!-- підсумок -->
<section id="s-summary" class="screen center" hidden>
  <div class="card wide">
    <h1 id="sum-title">Підсумок</h1>
    <div class="rank" id="sum-rank"></div>
    <p class="big" id="sum-total"></p>
    <div class="table-wrap"><table id="sum-table"></table></div>
    <p class="muted" id="sum-sync" role="status"></p>
    <div class="sum-actions">
      <button class="primary" type="button" id="sum-again">↻ Нова гра</button>
      <button type="button" id="sum-menu">☰ В меню</button>
      <button type="button" id="sum-exit">⎋ Вихід</button>
    </div>
  </div>
</section>

<!-- адмінка -->
<section id="s-admin" class="screen admin" hidden></section>

<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js?v=202610151445"></script>
<script src="js/sfx.js?v=202610151445"></script>
<script src="js/fx.js?v=202610151445"></script>
<script src="js/api.js?v=202610151445"></script>
<script src="js/tiles.js?v=202610151445"></script>
<script src="js/viewer.js?v=202610151445"></script>
<script src="js/logic.js?v=202610151445"></script>
<script src="js/game.js?v=202610151445"></script>
<script src="js/cards-data.js?v=202610151445"></script>
<script src="js/cards-data2.js?v=202610151445"></script>
<script src="js/cards.js?v=202610151445"></script>
<script src="js/ref.js?v=202610151445"></script>
<script src="js/help.js?v=202610151445"></script>
<script src="js/cards-commons.js?v=202610151445"></script>
<script src="js/cards-admin.js?v=202610151445"></script>
<script src="js/analytics.js?v=202610151445"></script>
<script src="js/compose.js?v=202610151445"></script>
<script src="js/scale.js?v=202610151445"></script>
<script src="js/crop.js?v=202610151445"></script>
<script src="js/models.js?v=202610151445"></script>
<script src="js/generator.js?v=202610151445"></script>
<script src="js/autogen.js?v=202610151445"></script>
<script src="js/admin.js?v=202610151445"></script>
<script src="js/main.js?v=202610151445"></script>
</body>
</html>
