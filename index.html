<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Пошук техніки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css?v=202610131115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141814'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c9d64a' stroke-width='2.5'/%3E%3Cpath d='M16 3v8M16 21v8M3 16h8M21 16h8' stroke='%23c9d64a' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body>

<!-- вхід -->
<section id="s-login" class="screen center" hidden>
  <form class="card narrow" id="login-form">
    <h1 class="logo">Пошук <span>техніки</span></h1>
    <p class="muted" id="login-sub">Тренування з пошуку техніки на знімках</p>
    <label for="login-pass">Пароль підрозділу</label>
    <input id="login-pass" type="password" autocomplete="current-password" required>
    <p class="err" id="login-err" role="alert"></p>
    <button class="primary" type="submit" id="login-btn">Увійти</button>
    <a class="link" href="#admin">⚙ Адмінка</a>
  </form>
</section>

<!-- старт -->
<section id="s-start" class="screen center" hidden>
  <form class="card narrow" id="start-form">
    <h1 class="logo">Пошук <span>техніки</span></h1>
    <p class="muted" id="start-info"></p>
    <label for="callsign">Позивний</label>
    <input id="callsign" autocomplete="nickname" maxlength="40" required>
    <p class="err" id="start-err" role="alert"></p>
    <button class="primary" type="submit" id="start-btn">Почати</button>
    <p class="muted small" id="pending-info"></p>
    <div class="links"><button type="button" class="link" id="logout-btn">Вийти</button><a class="link" href="#admin">⚙ Адмінка</a></div>
  </form>
</section>

<!-- гра -->
<section id="s-game" class="screen game" hidden>
  <header class="bar top">
    <div class="stage" id="g-stage"></div>
    <div class="stats">
      <div>Залишилось <b id="g-time">1:00</b></div>
      <div>Цілі <b id="g-found">0/1</b></div>
      <div>Промахи <b id="g-miss">0/1</b></div>
      <div>Бали <b id="g-score">0</b></div>
    </div>
  </header>
  <div class="timebar"><i id="g-timebar"></i></div>
  <div class="view-wrap">
    <div id="g-view" class="view-host"></div>
    <div class="loading" id="g-loading" hidden><span>Завантажую знімок…</span></div>
    <aside class="debrief" id="g-debrief" hidden></aside>
    <div class="brief" id="g-brief" hidden></div>
  </div>
  <footer class="bar bottom">
    <div class="msg" id="g-msg" role="status"></div>
    <button type="button" id="g-hint" title="Показати район 2×2 квадрати, де ціль (бали за етап: 5 замість 10)">💡 Підказка</button>
    <button type="button" id="g-skip">Пропустити етап</button>
    <button type="button" class="primary" id="g-next" hidden>Далі →</button>
    <button type="button" id="g-quit">Вийти</button>
  </footer>
</section>

<!-- підсумок -->
<section id="s-summary" class="screen center" hidden>
  <div class="card wide">
    <h1 id="sum-title">Підсумок</h1>
    <p class="big" id="sum-total"></p>
    <div class="table-wrap"><table id="sum-table"></table></div>
    <p class="muted" id="sum-sync" role="status"></p>
    <button class="primary" type="button" id="sum-again">Нова гра</button>
  </div>
</section>

<!-- адмінка -->
<section id="s-admin" class="screen admin" hidden></section>

<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js?v=202610131115"></script>
<script src="js/api.js?v=202610131115"></script>
<script src="js/tiles.js?v=202610131115"></script>
<script src="js/viewer.js?v=202610131115"></script>
<script src="js/logic.js?v=202610131115"></script>
<script src="js/game.js?v=202610131115"></script>
<script src="js/compose.js?v=202610131115"></script>
<script src="js/generator.js?v=202610131115"></script>
<script src="js/admin.js?v=202610131115"></script>
<script src="js/main.js?v=202610131115"></script>
</body>
</html>
