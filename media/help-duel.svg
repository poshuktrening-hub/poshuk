<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Manrope, Arial, sans-serif">
  <defs>
    <pattern id="fld" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#5b6b3c"/><path d="M0 10h40M0 30h40" stroke="#677944" stroke-width="6"/></pattern>
    <radialGradient id="boom" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#ffb23e"/><stop offset="1" stop-color="#ff5a2b" stop-opacity="0"/></radialGradient>
    <clipPath id="s1"><rect x="44" y="52" width="196" height="300" rx="16"/></clipPath>
    <clipPath id="s2"><rect x="400" y="52" width="196" height="300" rx="16"/></clipPath>
    <g id="veh"><rect x="-13" y="-6" width="26" height="12" rx="2" fill="#2b3226"/><rect x="-4" y="-4" width="10" height="8" rx="2" fill="#3a4433"/><rect x="5" y="-1" width="15" height="2" fill="#2b3226"/></g>
    <g id="tree"><circle r="17" fill="#2e4523"/><circle cx="-6" cy="-5" r="9" fill="#3a5a2c"/></g>
  </defs>
  <rect width="640" height="400" fill="#0f1317"/>

  <!-- 1: розстановка -->
  <rect x="34" y="36" width="216" height="332" rx="28" fill="#1d252c" stroke="#3a4651" stroke-width="2"/>
  <g clip-path="url(#s1)">
    <rect x="44" y="52" width="196" height="300" fill="url(#fld)"/>
    <path d="M44 150 C 110 170 160 140 240 190 L240 214 C 160 166 110 196 44 176 Z" fill="#8a7f63"/>
    <use href="#tree" x="80" y="250"/><use href="#tree" x="120" y="270"/><use href="#tree" x="190" y="245"/><use href="#tree" x="210" y="300"/><use href="#tree" x="70" y="310"/>
    <use href="#veh" transform="translate(96 100) rotate(20)"/>
    <use href="#veh" transform="translate(178 118) rotate(-30)"/>
    <use href="#veh" transform="translate(118 252) rotate(70)"/>
    <use href="#tree" x="128" y="246" opacity=".85"/>
    <use href="#veh" transform="translate(196 300) rotate(-60)"/>
    <g opacity=".95"><use href="#veh" transform="translate(150 214) rotate(15)"/><circle cx="150" cy="214" r="17" fill="none" stroke="#ffb23e" stroke-width="2.5" stroke-dasharray="4 3"/></g>
    <rect x="52" y="60" width="180" height="26" rx="13" fill="#11171c" opacity=".9"/>
    <text x="142" y="78" fill="#e8edf1" font-size="12" font-weight="700" text-anchor="middle">Сховайте 5 одиниць · 4/5</text>
  </g>
  <!-- палець -->
  <g transform="translate(166 232)"><path d="M0 0 l10 34 l6 -8 l9 12 l6 -4 l-9 -12 l10 -3 z" fill="#f5f7f9" stroke="#0f1317" stroke-width="2"/></g>
  <circle cx="52" cy="40" r="17" fill="#ffb23e"/><text x="52" y="46" font-size="18" font-weight="800" text-anchor="middle" fill="#0f1317">1</text>
  <text x="142" y="392" fill="#c9d1d8" font-size="14" font-weight="700" text-anchor="middle">Ховаєте свою техніку</text>

  <!-- між ними -->
  <g transform="translate(320 200)">
    <circle r="40" fill="#161d23" stroke="#3a4651" stroke-width="2"/>
    <path d="M-18 -8 h30 l-8 -8 M18 8 h-30 l8 8" fill="none" stroke="#ffb23e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="62" fill="#ffb23e" font-size="15" font-weight="800" text-anchor="middle">по черзі</text>
    <text y="82" fill="#c9d1d8" font-size="13" text-anchor="middle">30 с на хід</text>
  </g>

  <!-- 2: бій -->
  <rect x="390" y="36" width="216" height="332" rx="28" fill="#1d252c" stroke="#3a4651" stroke-width="2"/>
  <g clip-path="url(#s2)">
    <rect x="400" y="52" width="196" height="300" fill="url(#fld)"/>
    <path d="M400 210 C 470 190 520 230 596 200 L596 226 C 520 256 470 216 400 236 Z" fill="#8a7f63"/>
    <use href="#tree" x="430" y="120"/><use href="#tree" x="560" y="150"/><use href="#tree" x="470" y="300"/><use href="#tree" x="560" y="300"/>
    <use href="#veh" transform="translate(512 140) rotate(-15)"/>
    <circle cx="512" cy="140" r="34" fill="url(#boom)"/>
    <circle cx="512" cy="140" r="18" fill="none" stroke="#3ddc97" stroke-width="3"/>
    <rect x="452" y="262" width="22" height="22" fill="none" stroke="#ff5a4f" stroke-width="2.5"/>
    <rect x="408" y="60" width="180" height="28" rx="14" fill="#3ddc97"/>
    <text x="498" y="79" fill="#04140c" font-size="12.5" font-weight="800" text-anchor="middle">🎯 ВАШ ХІД · 0:24</text>
    <rect x="430" y="318" width="136" height="24" rx="12" fill="#11171c" opacity=".92"/>
    <text x="498" y="335" fill="#e8edf1" font-size="11.5" font-weight="700" text-anchor="middle">Влучання! Ходіть ще</text>
  </g>
  <circle cx="408" cy="40" r="17" fill="#ffb23e"/><text x="408" y="46" font-size="18" font-weight="800" text-anchor="middle" fill="#0f1317">2</text>
  <text x="498" y="392" fill="#c9d1d8" font-size="14" font-weight="700" text-anchor="middle">Б'єте по техніці суперника</text>
</svg>
