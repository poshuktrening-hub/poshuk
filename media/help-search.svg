<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Manrope, Arial, sans-serif">
  <defs>
    <pattern id="fld" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#5b6b3c"/><path d="M0 10h40M0 30h40" stroke="#677944" stroke-width="6"/></pattern>
    <radialGradient id="boom" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#ffb23e"/><stop offset="1" stop-color="#ff5a2b" stop-opacity="0"/></radialGradient>
    <clipPath id="scr"><rect x="214" y="34" width="212" height="332" rx="18"/></clipPath>
  </defs>
  <rect width="640" height="400" fill="#0f1317"/>
  <!-- телефон -->
  <rect x="204" y="18" width="232" height="364" rx="30" fill="#1d252c" stroke="#3a4651" stroke-width="2"/>
  <g clip-path="url(#scr)">
    <rect x="214" y="34" width="212" height="332" fill="url(#fld)"/>
    <path d="M214 120 C 280 140 330 120 426 170 L426 200 C 330 150 280 172 214 150 Z" fill="#8a7f63"/>
    <rect x="214" y="250" width="212" height="116" fill="#3f5a2e"/>
    <circle cx="250" cy="280" r="22" fill="#2e4523"/><circle cx="292" cy="300" r="26" fill="#2e4523"/><circle cx="390" cy="290" r="24" fill="#2e4523"/>
    <!-- техніка -->
    <g transform="translate(330 214) rotate(-18)"><rect x="-17" y="-8" width="34" height="16" rx="2" fill="#2b3226"/><rect x="-5" y="-5" width="13" height="10" rx="2" fill="#3a4433"/><rect x="6" y="-1.2" width="22" height="2.4" fill="#2b3226"/></g>
    <circle cx="330" cy="214" r="26" fill="url(#boom)" opacity=".9"/>
    <!-- верхня панель -->
    <rect x="214" y="34" width="212" height="38" fill="#11171c" opacity=".92"/>
    <text x="226" y="58" fill="#e8edf0" font-size="13" font-weight="700">⏱ 0:42</text>
    <text x="300" y="58" fill="#e8edf0" font-size="13" font-weight="700">🎯 1/2</text>
    <text x="368" y="58" fill="#ff8a7a" font-size="13" font-weight="700">✗ 0/1</text>
    <rect x="214" y="72" width="150" height="4" fill="#ffb23e"/>
  </g>
  <!-- палець і приціл -->
  <circle cx="330" cy="214" r="14" fill="none" stroke="#fff" stroke-width="2.5"/>
  <path d="M330 194v8M330 226v8M310 214h8M342 214h8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M352 236 q8 30 -4 64 l-22 -6 q6 -22 -8 -40 q-6 -10 4 -12 q8 0 14 10 l4 -30 q2 -10 10 -8 q6 2 6 10 z" fill="#f1d2b6" stroke="#9c7b62" stroke-width="1.5"/>
  <!-- щипок (зум) -->
  <g transform="translate(110 200)">
    <circle r="62" fill="#161c21" stroke="#2b353e"/>
    <path d="M-30 30 L-8 8 M30 -30 L8 -8" stroke="#ffb23e" stroke-width="4" stroke-linecap="round"/>
    <path d="M-30 30 l0 -14 M-30 30 l14 0 M30 -30 l0 14 M30 -30 l-14 0" stroke="#ffb23e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-8" cy="8" r="7" fill="#f1d2b6"/><circle cx="8" cy="-8" r="7" fill="#f1d2b6"/>
    <text y="88" fill="#9aa6ae" font-size="14" text-anchor="middle">зум і рух</text>
  </g>
  <!-- "Далі" -->
  <g transform="translate(530 200)">
    <circle r="62" fill="#161c21" stroke="#2b353e"/>
    <rect x="-44" y="-18" width="88" height="36" rx="12" fill="#ffb23e"/>
    <text y="6" fill="#17120a" font-size="15" font-weight="800" text-anchor="middle">Далі →</text>
    <text y="88" fill="#9aa6ae" font-size="14" text-anchor="middle">після етапу</text>
  </g>
  <!-- номери кроків -->
  <g font-size="15" font-weight="800" text-anchor="middle">
    <circle cx="62" cy="128" r="15" fill="#ffb23e"/><text x="62" y="133" fill="#17120a">1</text>
    <circle cx="372" cy="180" r="15" fill="#ffb23e"/><text x="372" y="185" fill="#17120a">2</text>
    <circle cx="440" cy="52" r="15" fill="#ffb23e"/><text x="440" y="57" fill="#17120a">3</text>
    <circle cx="578" cy="128" r="15" fill="#ffb23e"/><text x="578" y="133" fill="#17120a">4</text>
  </g>
</svg>
